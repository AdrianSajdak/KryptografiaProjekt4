[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficfp"
version = "0.1.0"
description = "Identyfikacja rodzaju ruchu w szyfrowanym kanale na podstawie metadanych pakietów (k-NN)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
