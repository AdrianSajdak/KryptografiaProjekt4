# Konfiguracja eksperymentów. Ścieżki są względne wobec katalogu projektu.
seed: 42

paths:
  raw: data/raw/ucdavis_quic
  processed: data/processed
  tables: reports/tables
  figures: reports/figures

features:
  # Liczba początkowych pakietów widzianych przez przeciwnika. Najkrótszy
  # przepływ ma 176 pakietów, więc żaden wektor nie wymaga dopełniania.
  packet_counts: [10, 25, 50, 100, 150]
  feature_sets: [sizes, timing, sizes+timing, stats, all]

split:
  # Część najpóźniej zebranych przepływów każdej aplikacji przeznaczona na test.
  test_fraction: 0.2
  cv_folds: 5

knn:
  neighbors: [1, 3, 5, 7, 9, 11, 15, 21]
  metrics: [euclidean, manhattan]
  weights: [uniform, distance]
  # Metryka wyboru konfiguracji w walidacji krzyżowej.
  selection_scoring: f1_macro

success:
  # Kryterium z instrukcji projektu.
  accuracy_threshold: 0.90

padding:
  # Największy rozmiar pakietu w zbiorze UC Davis. Obrony go nie przekraczają (rola MTU).
  max_size: 1486
  # Dopełnianie do wielokrotności bloku [B].
  block_sizes: [64, 128, 256, 512]
  # Losowe wypełnienie: górna granica dopisanych bajtów [B].
  random_max_extra: [50, 100, 200, 400]

baselines:
  # Modele referencyjne uczone na tych samych cechach co najlepszy k-NN.
  random_forest:
    n_estimators: 300
    max_depth: [null, 20]
    min_samples_leaf: [1, 3]
  svm:
    C: [1, 10, 100]
    gamma: [scale, 0.01]

cesnet:
  # Walidacja na ruchu TLS po TCP (CESNET-TLS22). Usługi wybrane w data/cesnet.py.
  raw: data/raw/cesnet_tls22
  processed: data/processed/cesnet_tls22
  # Liczba losowanych przepływów każdej kategorii z każdego dnia.
  per_category_per_day: 400
  # Minimalna liczba pakietów z danymi w polu PPI (najwyżej 30).
  min_packets: 10
  train_week: W-2021-40
  test_week: W-2021-41
  packet_counts: [10, 20, 30]
  neighbors: [1, 3, 5, 9, 15]
